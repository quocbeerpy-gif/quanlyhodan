<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Báo cáo công việc Trưởng thôn</title>
<style>
:root{--bg:#f2f6f4;--card:#fff;--tx:#14231c;--mu:#5d7068;--pr:#0f7a55;--pr2:#14b37d;--bd:#dde7e2;--wa:#d98a0b;--er:#d64545;--sh:0 6px 24px rgba(15,60,40,.08);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1512;--card:#16211c;--tx:#e8f1ec;--mu:#8fa69b;--pr:#2bc48c;--pr2:#1a8f67;--bd:#26362f;--sh:0 6px 24px rgba(0,0,0,.4)}}
:root[data-theme="dark"]{--bg:#0d1512;--card:#16211c;--tx:#e8f1ec;--mu:#8fa69b;--pr:#2bc48c;--pr2:#1a8f67;--bd:#26362f;--sh:0 6px 24px rgba(0,0,0,.4)}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.5 "Segoe UI",system-ui,Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:0;z-index:5;background:linear-gradient(120deg,#0b5d42,#14b37d);color:#fff;padding:12px 18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top b{font-size:17px}.top .sp{flex:1}
.nav{display:flex;gap:6px}
.nav button,.ib{background:rgba(255,255,255,.16);border:0;color:#fff;padding:7px 13px;border-radius:99px;cursor:pointer}
.nav button.on{background:#fff;color:#0b5d42;font-weight:600}
.wrap{max-width:1000px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;box-shadow:var(--sh);padding:18px;margin-bottom:16px}
h2{margin:0 0 4px;font-size:22px}h3{margin:0 0 8px;font-size:16px}
.mu{color:var(--mu);font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;box-shadow:var(--sh)}
.stat b{display:block;font-size:26px;color:var(--pr)}
.btn{background:linear-gradient(120deg,var(--pr),var(--pr2));color:#fff;border:0;padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:600}
.btn.g{background:transparent;color:var(--pr);border:1px solid var(--pr)}
.btn.s{padding:6px 12px;font-size:13px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:10px;padding:10px 12px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr)}
textarea{min-height:70px;resize:vertical}
label{font-size:13px;color:var(--mu);display:block;margin:10px 0 4px}
.login{min-height:100vh;display:grid;place-items:center;padding:20px;background:linear-gradient(135deg,#0b5d42,#14b37d 60%,#7be0b8)}
.login .card{width:100%;max-width:400px;padding:30px}
.logo{font-size:44px;text-align:center}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.p-ok{background:#d6f5e6;color:#0b6b46}.p-dr{background:#fdecc8;color:#8a5a00}.p-no{background:#eee;color:#666}
.bar{height:8px;background:var(--bd);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2))}
.task{border:1px solid var(--bd);border-radius:14px;padding:14px;margin-bottom:12px;background:var(--card)}
.task h3{color:var(--pr)}
.chk{display:flex;gap:8px;align-items:flex-start;font-size:14px;padding:3px 0;cursor:pointer}
.chk input{width:auto;margin-top:4px}
.res{background:var(--bg);border-radius:10px;padding:8px 10px;font-size:13px;margin:8px 0;color:var(--mu)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:600px){.row{grid-template-columns:1fr}.top b{font-size:15px}}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--bd)}
th{color:var(--mu);font-weight:600;font-size:12px;text-transform:uppercase}
.tw{overflow-x:auto}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:20px}
.modal .card{max-width:760px;width:100%}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#111;color:#fff;padding:10px 18px;border-radius:99px;z-index:30}
.err{color:var(--er);font-size:13px;min-height:18px;margin-top:8px}
.sticky{position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);padding:12px;display:flex;gap:10px;justify-content:flex-end;flex-wrap:wrap;border-radius:0 0 16px 16px}
.split{display:grid;grid-template-columns:290px 1fr;gap:16px;align-items:start}.side{position:sticky;top:70px;background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:8px;box-shadow:var(--sh);max-height:calc(100vh - 90px);overflow:auto}.si{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:none;border:0;border-radius:10px;padding:9px 10px;cursor:pointer}.si b{color:var(--pr);min-width:28px}.si span{flex:1;font-size:13px;line-height:1.3}.si i{width:10px;height:10px;border-radius:50%;background:var(--bd);flex:none}.si i.p-ok{background:var(--pr)}.si i.p-dr{background:var(--wa)}.si:hover{background:var(--bg)}.si.on{background:var(--pr);color:#fff}.si.on b{color:#fff}.si.on i{box-shadow:0 0 0 2px #fff}@media(max-width:760px){.split{grid-template-columns:1fr}.side{position:static;max-height:240px}}
.cl-ht{background:var(--pr)}.cl-dt{background:var(--wa)}.cl-ch{background:#9aa8a1}.cl-no{background:var(--bd)}.sg{display:flex;height:14px;border-radius:9px;overflow:hidden;background:var(--bd)}.sg i{display:block;height:100%}.dr{display:grid;grid-template-columns:minmax(120px,240px) 1fr 74px;gap:12px;align-items:center;padding:7px 0;border-bottom:1px solid var(--bd);font-size:13px}.hm{border-collapse:separate;border-spacing:3px}.hm th,.hm td{padding:0;text-align:center;border:0}.hm th{font-size:11px}.hm td.n{text-align:left;padding-right:8px;white-space:nowrap;font-size:13px}.hm .c{width:28px;height:28px;border-radius:7px;display:inline-block;vertical-align:middle}.tr{display:flex;align-items:flex-end;gap:12px;height:150px}.tr div{flex:1;text-align:center;font-size:12px;display:flex;flex-direction:column;justify-content:flex-end;height:100%}.tr i{display:block;background:linear-gradient(var(--pr2),var(--pr));border-radius:8px 8px 0 0;min-height:3px}.kn{border-left:3px solid var(--wa);padding:4px 10px;margin:8px 0;background:var(--bg);border-radius:0 8px 8px 0;font-size:13px}@media(max-width:600px){.dr{grid-template-columns:1fr;gap:4px}}
@media print{.top,.sticky,.noprint{display:none!important}.modal{position:static;background:none}body{background:#fff}}
</style>
</head>

function tick(id,i,on){const d=(cur.d[id]=cur.d[id]||{done:[]});d.done=d.done||[];on?d.done.includes(i)||d.done.push(i):d.done=d.done.filter(x=>x!==i)}
function setP(){period=$("py").value+"-"+$("pm").value;render()}
function perSel(){const[y,m]=period.split("-"),yr=new Date().getFullYear();let o="";for(let i=yr-2;i<=yr+1;i++)o+=`<option value="${i}" ${String(i)===y?"selected":""}>Năm ${i}</option>`;let q="";for(let i=1;i<=12;i++){const v=String(i).padStart(2,"0");q+=`<option value="${v}" ${v===m?"selected":""}>Tháng ${i}</option>`}return `<div style="display:flex;gap:8px"><select id="pm" style="flex:1;min-width:0;padding:10px 6px" onchange="setP()">${q}</select><select id="py" style="flex:1;min-width:0;padding:10px 6px" onchange="setP()">${o}</select></div>`}
function nav(n){const ts=tasksFor(me),i=ts.findIndex(t=>t[0]===act)+n;if(ts[i]){act=ts[i][0];render()}}
function head(){
 const nm=me==="admin"?"Quản trị UBND xã":U[me][0];
 const tabs=me==="admin"?[["admin","Tổng hợp"],["dash","Dashboard"]]:[["home","Trang chủ"],["dash","Dashboard"],["hist","Lịch sử"]];
 return `<div class="top noprint"><b>📋 Báo cáo Trưởng thôn</b><div class="nav">${tabs.map(t=>`<button class="${view===t[0]||(view==="form"&&t[0]==="home")?"on":""}" onclick="go('${t[0]}')">${t[1]}</button>`).join("")}</div><span class="sp"></span><span class="mu" style="color:#e5fff4">${esc(nm)}${me==="admin"?"":" · "+esc(U[me][1])}</span><button class="ib" onclick="toggleTheme()" title="Giao diện">🌓</button><button class="ib" onclick="logout()">Đăng xuất</button></div>`;
}
function loginV(){
 return `<div class="login"><div class="card"><div class="logo">🏘️</div><h2 style="text-align:center">Báo cáo công việc</h2><p class="mu" style="text-align:center;margin:0 0 14px">Hệ thống dành cho Trưởng thôn</p>
 <label>Tên đăng nhập (họ tên hoặc tên thôn)</label><input id="lu" list="ul" autocomplete="username" placeholder="VD: Trần Hậu hoặc Vũng Rô"><datalist id="ul">${U.map(x=>`<option value="${esc(x[0])}"><option value="${esc(x[1])}">`).join("")}</datalist>
 <label>Mật khẩu (số điện thoại)</label><input id="lp" type="password" autocomplete="current-password" placeholder="Số điện thoại" onkeydown="if(event.key==='Enter')login()">
 <div class="err" id="er"></div><button class="btn" style="width:100%;margin-top:8px" onclick="login()">Đăng nhập</button></div></div>`;
}
function homeV(){
 const mine=R.filter(r=>r.u===me).sort((a,b)=>b.p.localeCompare(a.p));
 const r=find(me,nowP()),sent=mine.filter(x=>x.s==="sent").length;
 return head()+`<div class="wrap"><div class="card"><h2>Xin chào, ${esc(U[me][0])} 👋</h2><div class="mu">Trưởng thôn ${esc(U[me][1])} · ${tasksFor(me).length} lĩnh vực cần báo cáo</div>
 <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap;align-items:end"><div style="max-width:300px;min-width:240px"><label>Kỳ báo cáo</label>${perSel()}</div><button class="btn" onclick="newRep()">${find(me,period)?"✏️ Tiếp tục / sửa báo cáo":"➕ Lập báo cáo mới"}</button></div></div>
 <div class="grid"><div class="stat"><span class="mu">Báo cáo đã gửi</span><b>${sent}</b></div><div class="stat"><span class="mu">Bản nháp</span><b>${mine.length-sent}</b></div><div class="stat"><span class="mu">Tháng này</span><b>${r?pct(r)+"%":"—"}</b><span class="pill ${r&&r.s==="sent"?"p-ok":"p-dr"}">${r?(r.s==="sent"?"Đã gửi":"Nháp"):"Chưa lập"}</span></div></div>
 <div class="card"><h3>Báo cáo gần đây</h3>${listV(mine.slice(0,4))}</div></div>`;
}
function listV(a){
 if(!a.length)return `<p class="mu">Chưa có báo cáo nào.</p>`;
 return `<div class="tw"><table><tr><th>Kỳ</th><th>Hoàn thành</th><th>Trạng thái</th><th>Cập nhật</th><th></th></tr>${a.map(r=>`<tr><td><b>${fmtP(r.p)}</b></td><td style="min-width:110px"><div class="bar"><i style="width:${pct(r)}%"></i></div><span class="mu">${pct(r)}%</span></td><td><span class="pill ${r.s==="sent"?"p-ok":"p-dr"}">${r.s==="sent"?"Đã gửi":"Nháp"}</span></td><td class="mu">${fmtD(r.t)}</td><td><button class="btn g s" onclick="newRep('${r.p}')">Mở</button> <button class="btn g s" onclick="show(${r.id})">Xem</button></td></tr>`).join("")}</table></div>`;
}
function histV(){return head()+`<div class="wrap"><div class="card"><h2>Lịch sử báo cáo</h2>${listV(R.filter(r=>r.u===me).sort((a,b)=>b.p.localeCompare(a.p)))}</div></div>`}
function formV(){
 const ts=tasksFor(me);
 return head()+`<div class="wrap"><div class="card"><h2>Báo cáo ${fmtP(cur.p)}</h2><div class="mu">Thôn ${esc(U[me][1])} · Trưởng thôn ${esc(U[me][0])}</div></div>
 <div class="split"><div class="side noprint">${ts.map(t=>{const d=cur.d[t[0]]||{};const s=ST[d.st];return `<button class="si ${t[0]===act?"on":""}" onclick="act='${t[0]}';render()"><b>${t[0]}</b><span>${esc(t[1])}</span><i class="${s?s[1]:""}"></i></button>`}).join("")}</div><div class="mainp">${ts.filter(t=>t[0]===act).map(t=>{const d=cur.d[t[0]]||{done:[]};return `<div class="task"><h3>${t[0]}. ${esc(t[1])}</h3>
 ${t[2].map((x,i)=>`<label class="chk" style="margin:0;color:inherit;font-size:14px"><input type="checkbox" ${(d.done||[]).includes(i)?"checked":""} onchange="tick('${t[0]}',${i},this.checked)"><span>${esc(x)}</span></label>`).join("")}
 <div class="res">🎯 <b>Kết quả cần đạt:</b> ${esc(t[3])}</div>
 <div class="row"><div><label>Mức độ thực hiện</label><select onchange="setD('${t[0]}','st',this.value)"><option value="">— Chọn —</option>${Object.entries(ST).map(([k,v])=>`<option value="${k}" ${d.st===k?"selected":""}>${v[0]}</option>`).join("")}</select></div><div><label>Số liệu / minh chứng</label><input value="${esc(d.sl)}" oninput="setD('${t[0]}','sl',this.value)" placeholder="VD: 12 hộ, 3 vụ việc..."></div></div>
 <label>Nội dung đã thực hiện</label><textarea oninput="setD('${t[0]}','nd',this.value)">${esc(d.nd)}</textarea>
 <label>Khó khăn, kiến nghị</label><textarea oninput="setD('${t[0]}','kn',this.value)">${esc(d.kn)}</textarea><div style="display:flex;justify-content:space-between;margin-top:12px"><button class="btn g s" onclick="nav(-1)">← Trước</button><button class="btn g s" onclick="nav(1)">Tiếp →</button></div></div>`}).join("")}</div></div>
 <div class="card"><label style="margin-top:0">Ý kiến khác / nhiệm vụ đột xuất</label><textarea oninput="cur.other=this.value">${esc(cur.other)}</textarea>
 <div class="sticky"><button class="btn g" onclick="go('home')">Hủy</button><button class="btn g" onclick="saveRep(false)">💾 Lưu nháp</button><button class="btn" onclick="saveRep(true)">📤 Gửi báo cáo</button></div></div></div>`;
}
function detail(r){
 return `<h2>${esc(U[r.u][1])} — ${fmtP(r.p)}</h2><div class="mu">Trưởng thôn ${esc(U[r.u][0])} · SĐT ${esc(U[r.u][2])} · ${r.s==="sent"?"Đã gửi":"Nháp"} · ${fmtD(r.t)} · Hoàn thành ${pct(r)}%</div>`+tasksFor(r.u).map(t=>{const d=r.d[t[0]]||{};const s=ST[d.st];return `<div style="border-top:1px solid var(--bd);padding:10px 0"><b>${t[0]}. ${esc(t[1])}</b> ${s?`<span class="pill ${s[1]}">${s[0]}</span>`:`<span class="pill p-no">Chưa báo cáo</span>`}<div class="mu">Đã làm ${(d.done||[]).length}/${t[2].length} ý chính${d.sl?" · Số liệu: "+esc(d.sl):""}</div>${d.nd?`<div>${esc(d.nd)}</div>`:""}${d.kn?`<div class="mu">⚠ Kiến nghị: ${esc(d.kn)}</div>`:""}</div>`}).join("")+(r.other?`<p><b>Ý kiến khác:</b> ${esc(r.other)}</p>`:"");
}
function show(id){const r=R.find(x=>x.id===id);const m=document.createElement("div");m.className="modal";m.id="md";m.onclick=e=>{if(e.target===m)m.remove()};m.innerHTML=`<div class="card">${detail(r)}<div class="noprint" style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px"><button class="btn g s" onclick="print()">🖨 In</button><button class="btn s" onclick="$('md').remove()">Đóng</button></div></div>`;document.body.appendChild(m)}
function adminV(){
 const rs=U.map((u,i)=>({u,i,r:find(i,period)}));
 const sent=rs.filter(x=>x.r&&x.r.s==="sent").length;
 const avg=Math.round(rs.reduce((a,x)=>a+(x.r?pct(x.r):0),0)/9);
 return head()+`<div class="wrap"><div class="card"><h2>Tổng hợp báo cáo 9 thôn</h2><div style="display:flex;gap:10px;align-items:end;flex-wrap:wrap"><div style="max-width:300px;min-width:240px"><label>Kỳ báo cáo</label>${perSel()}</div><button class="btn g" onclick="csv()">⬇ Xuất CSV</button></div></div>
 <div class="grid"><div class="stat"><span class="mu">Đã nộp</span><b>${sent}/9</b></div><div class="stat"><span class="mu">Chưa nộp</span><b>${9-sent}</b></div><div class="stat"><span class="mu">Tiến độ TB</span><b>${avg}%</b></div></div>
 <div class="card tw"><table><tr><th>Thôn</th><th>Trưởng thôn</th><th>SĐT</th><th>Tiến độ</th><th>Trạng thái</th><th></th></tr>${rs.map(x=>`<tr><td><b>${esc(x.u[1])}</b></td><td>${esc(x.u[0])}</td><td class="mu">${x.u[2]}</td><td style="min-width:100px"><div class="bar"><i style="width:${x.r?pct(x.r):0}%"></i></div></td><td><span class="pill ${x.r?(x.r.s==="sent"?"p-ok":"p-dr"):"p-no"}">${x.r?(x.r.s==="sent"?"Đã gửi":"Nháp"):"Chưa nộp"}</span></td><td>${x.r?`<button class="btn g s" onclick="show(${x.r.id})">Xem</button>`:""}</td></tr>`).join("")}</table></div></div>`;
}
function dashV(){
 const adm=me==="admin",sc=adm?U.map((_,i)=>i):[me];
 const rr=sc.map(i=>find(i,period)).filter(Boolean);
 const sent=rr.filter(r=>r.s==="sent").length;
 const avg=rr.length?Math.round(rr.reduce((a,r)=>a+pct(r),0)/rr.length):0;
 const kns=[];rr.forEach(r=>tasksFor(r.u).forEach(t=>{const d=r.d[t[0]];if(d&&d.kn)kns.push([U[r.u][1],t,d.kn])}));
 const rows=T.map(t=>{const us=sc.filter(i=>tasksFor(i).includes(t));const c={ht:0,dt:0,ch:0,no:0};let done=0,tot=0;us.forEach(i=>{const r=find(i,period),d=r&&r.d[t[0]];c[d&&d.st?d.st:"no"]++;tot+=t[2].length;done+=d&&d.done?d.done.length:0});return{t,n:us.length,c,done,tot,sc:us.length?(c.ht+c.dt/2)/us.length:0}}).filter(x=>x.n);
 const weak=rows.slice().sort((a,b)=>a.sc-b.sc).slice(0,3);
 const per=[...new Set(R.filter(r=>sc.includes(r.u)).map(r=>r.p))].sort().slice(-6);
 const trend=per.map(p=>{const a=R.filter(r=>r.p===p&&sc.includes(r.u));return[p,Math.round(a.reduce((s,r)=>s+pct(r),0)/a.length)]});
 const K=[["ht","Hoàn thành"],["dt","Đang thực hiện"],["ch","Chưa thực hiện"],["no","Chưa báo cáo"]];
 const lg=`<div class="mu" style="display:flex;gap:12px;flex-wrap:wrap;margin-top:10px">${K.map(x=>`<span><span class="cl-${x[0]}" style="display:inline-block;width:10px;height:10px;border-radius:3px"></span> ${x[1]}</span>`).join("")}</div>`;
 const nm=Object.fromEntries(K);
 return head()+`<div class="wrap"><div class="card"><h2>Dashboard phân tích</h2><div class="mu">${adm?"Toàn bộ 9 thôn":"Thôn "+esc(U[me][1])} · ${fmtP(period)}</div><div style="max-width:300px;min-width:240px"><label>Kỳ báo cáo</label>${perSel()}</div></div>
 <div class="grid"><div class="stat"><span class="mu">${adm?"Thôn đã gửi":"Trạng thái"}</span><b>${adm?sent+"/9":(rr[0]?(rr[0].s==="sent"?"Đã gửi":"Nháp"):"—")}</b></div><div class="stat"><span class="mu">Tiến độ trung bình</span><b>${avg}%</b></div><div class="stat"><span class="mu">Lĩnh vực hoàn thành</span><b>${rows.reduce((a,x)=>a+x.c.ht,0)}/${rows.reduce((a,x)=>a+x.n,0)}</b></div><div class="stat"><span class="mu">Kiến nghị, khó khăn</span><b>${kns.length}</b></div></div>
 ${rr.length&&weak.length?`<div class="card"><h3>⚠ Lĩnh vực cần chú ý</h3>${weak.map(x=>`<div class="kn"><b>${x.t[0]}. ${esc(x.t[1])}</b> — điểm hoàn thành ${Math.round(x.sc*100)}%</div>`).join("")}</div>`:""}
 <div class="card"><h3>Mức độ thực hiện theo từng hạng mục</h3>${rows.map(x=>`<div class="dr"><div><b>${x.t[0]}.</b> ${esc(x.t[1])}</div><div class="sg">${K.map(k=>`<i class="cl-${k[0]}" style="width:${x.c[k[0]]/x.n*100}%" title="${k[1]}: ${x.c[k[0]]}"></i>`).join("")}</div><div class="mu">Ý chính ${x.done}/${x.tot}</div></div>`).join("")}${lg}</div>
 ${adm?`<div class="card"><h3>Ma trận thôn × hạng mục</h3><div class="tw"><table class="hm"><tr><th></th>${T.map(t=>`<th title="${esc(t[1])}">${t[0]}</th>`).join("")}<th>%</th></tr>${U.map((u,i)=>{const r=find(i,period);return `<tr><td class="n">${esc(u[1])}</td>${T.map(t=>{if(!tasksFor(i).includes(t))return "<td class=\"mu\">–</td>";const d=r&&r.d[t[0]];const k=d&&d.st?d.st:"no";return `<td><span class="c cl-${k}" title="${esc(u[1])} · ${t[0]}: ${nm[k]}"></span></td>`}).join("")}<td class="mu">${r?pct(r)+"%":"—"}</td></tr>`}).join("")}</table></div>${lg}</div>
 <div class="card"><h3>Tiến độ từng thôn</h3>${U.map((u,i)=>{const r=find(i,period);return `<div class="dr"><div><b>${esc(u[1])}</b> <span class="mu">${esc(u[0])}</span></div><div class="bar"><i style="width:${r?pct(r):0}%"></i></div><div class="mu">${r?pct(r)+"%":"Chưa nộp"}</div></div>`}).join("")}</div>`:""}
 <div class="card"><h3>Xu hướng tiến độ theo tháng</h3>${trend.length?`<div class="tr">${trend.map(x=>`<div><span class="mu">${x[1]}%</span><i style="height:${x[1]*1.1}px"></i><span class="mu">${x[0].slice(5)}/${x[0].slice(2,4)}</span></div>`).join("")}</div>`:`<p class="mu">Chưa có dữ liệu.</p>`}</div>
 <div class="card"><h3>Khó khăn, kiến nghị của kỳ này</h3>${kns.length?kns.map(k=>`<div class="kn"><b>${esc(k[0])} · ${k[1][0]}. ${esc(k[1][1])}</b><br>${esc(k[2])}</div>`).join(""):`<p class="mu">Chưa có kiến nghị nào.</p>`}</div></div>`;
}
function csv(){
 const rows=[["Thôn","Trưởng thôn","Kỳ","Trạng thái","Lĩnh vực","Mức độ","Số liệu","Nội dung","Kiến nghị"]];
 R.filter(r=>r.p===period).forEach(r=>tasksFor(r.u).forEach(t=>{const d=r.d[t[0]]||{};rows.push([U[r.u][1],U[r.u][0],r.p,r.s==="sent"?"Đã gửi":"Nháp",t[0]+". "+t[1],(ST[d.st]||[""])[0],d.sl||"",d.nd||"",d.kn||""])}));
 const c="\ufeff"+rows.map(r=>r.map(v=>'"'+String(v).replace(/"/g,'""')+'"').join(",")).join("\n");
 const a=document.createElement("a");a.href="data:text/csv;charset=utf-8,"+encodeURIComponent(c);a.download="bao-cao-"+period+".csv";a.click();
}
function render(){
 const a=$("app");
 if(me===null)a.innerHTML=loginV();
 else if(me==="admin")a.innerHTML=view==="dash"?dashV():adminV();
 else a.innerHTML=view==="form"&&cur?formV():view==="hist"?histV():view==="dash"?dashV():homeV();
 scrollTo(0,0);
}
setTheme();render();
</script>
</body>
</html>
